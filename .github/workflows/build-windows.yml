name: Build PHP Windows
on:
  workflow_dispatch:
    
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Install NASM
        run: choco install nasm -y

      - name: Install Strawberry Perl
        run: choco install strawberryperl -y

      - name: Refresh PATH
        run: |
          echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Download SPC
        run: curl -L -o spc.exe https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-windows-x64.exe

      - name: Setup PHP SDK Binary Tools
        run: git clone --depth=1 https://github.com/php/php-sdk-binary-tools.git php-sdk-binary-tools

      - name: Download Sources
        run: ./spc.exe download --with-php=8.3 --for-extensions="pdo_mysql,pdo_sqlite,mysqli,zip,xml,simplexml,gd,fileinfo,mbstring,openssl,curl,bcmath,intl,sodium"

      - name: Build
        run: |
          ./spc.exe build "pdo_mysql,pdo_sqlite,mysqli,zip,xml,simplexml,gd,fileinfo,mbstring,openssl,curl,bcmath,intl,sodium" --build-cli --with-hardcoded-ini="post_max_size=128M" --with-hardcoded-ini="upload_max_filesize=128M" --with-hardcoded-ini="memory_limit=512M" --with-hardcoded-ini="max_execution_time=0" --with-hardcoded-ini="max_input_time=300" --debug

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            log/spc.output.log
            log/spc.shell.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-windows-x64
          path: buildroot/bin/php.exe
